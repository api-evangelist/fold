name: Fold
description: >-
  Fold (NASDAQ: FLD) is a bitcoin financial services company founded in 2014 and
  based in Atlanta, Georgia, billed as the first publicly traded bitcoin
  financial services company. Fold makes it easy for individuals and businesses
  to earn, save, and use bitcoin through consumer products including the Fold
  App, the Fold Bitcoin Rewards Credit Card, the Fold Debit Card, and the Fold
  Bitcoin Gift Card marketplace, paying real bitcoin rewards (not points or a
  proprietary token) on everyday purchases and bill payments. Bitcoin custody
  and Lightning Network payouts are powered by partners such as BitGo and
  OpenNode. Fold is a consumer-facing fintech application and does not publish a
  public developer API, OpenAPI specification, or developer portal; this profile
  is maintained as a company record in the API Evangelist network.
